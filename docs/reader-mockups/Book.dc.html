<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A book</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#000}a:hover{color:#000}
</style>
</helmet>
<div style="width: 1404px; height: 1872px; box-sizing: border-box; background: #fff; color: #000; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column;">
  <header style="height: 140px; box-sizing: border-box; border-bottom: 3px solid #000; padding: 0 40px; display: flex; align-items: center; gap: 32px;">
    <button style="height: 100px; padding: 0 16px; border: none; background: #fff; color: #000; font-family: inherit; font-size: 38px; font-weight: 700; display: flex; align-items: center; gap: 12px;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Back
    </button>
    <span style="flex: 1; font-size: 46px; font-weight: 700;">Banda do Bairro</span>
  </header>
  <main style="flex: 1; box-sizing: border-box; padding: 0 48px; display: flex; flex-direction: column;">
    <div style="height: 72px; display: flex; align-items: flex-end; padding-bottom: 8px; box-sizing: border-box; font-size: 30px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; border-bottom: 3px solid #000;">Setlists</div>
    <sc-for list="{{setlists}}" as="s" hint-placeholder-count="2">
      <button style="height: 130px; box-sizing: border-box; border: none; border-bottom: 2px solid #000; background: #fff; color: #000; font-family: inherit; text-align: left; padding: 0; display: flex; align-items: center; gap: 24px;">
        <span style="flex: 1; font-size: 44px; font-weight: 700;">{{s.name}}</span>
        <span style="font-size: 32px;">{{s.meta}}</span>
      </button>
    </sc-for>
    <div style="height: 72px; display: flex; align-items: flex-end; padding-bottom: 8px; box-sizing: border-box; font-size: 30px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; border-bottom: 3px solid #000;">Songs</div>
    <sc-for list="{{songs}}" as="s" hint-placeholder-count="8">
      <button style="height: 130px; box-sizing: border-box; border: none; border-bottom: 2px solid #000; background: #fff; color: #000; font-family: inherit; text-align: left; padding: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px;">
        <span style="font-size: 42px; font-weight: 700;">{{s.title}}</span>
        <span style="font-size: 30px;">{{s.artist}}</span>
      </button>
    </sc-for>
  </main>
  <nav aria-label="Songs by first letter" style="height: 200px; box-sizing: border-box; border-top: 3px solid #000; padding: 4px 48px; display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr));">
    <sc-for list="{{letters}}" as="l" hint-placeholder-count="26">
      <sc-if value="{{l.present}}" hint-placeholder-val="{{ true }}">
        <button style="border: none; background: #fff; color: #000; font-family: inherit; font-size: 40px; font-weight: 700;">{{l.ch}}</button>
      </sc-if>
      <sc-if value="{{l.absent}}" hint-placeholder-val="{{ false }}">
        <span></span>
      </sc-if>
    </sc-for>
  </nav>
  <footer style="height: 100px; box-sizing: border-box; border-top: 3px solid #000; padding: 0 40px 0 48px; display: flex; align-items: center; gap: 24px;">
    <span style="flex: 1;"></span>
    <button aria-label="Previous page" style="width: 96px; height: 80px; border: 3px solid #000; background: #fff; color: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <span style="font-size: 34px; min-width: 150px; text-align: center;">1 of 7</span>
    <button aria-label="Next page" style="width: 96px; height: 80px; border: 3px solid #000; background: #fff; color: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1404,"height":1872}}'>
class Component extends DCLogic {
  renderVals() {
    const present = 'ABCDEFGILMNOPQRSTV';
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((ch) => ({
      ch,
      present: present.includes(ch),
      absent: !present.includes(ch),
    }));
    return {
      setlists: [
        { name: 'Bar do Zé, 10 October', meta: '6 songs' },
        { name: 'Ensaio de terça', meta: '8 songs' },
      ],
      songs: [
        { title: 'Aquarela', artist: 'Toquinho' },
        { title: 'Asa Branca', artist: 'Luiz Gonzaga' },
        { title: 'Carinhoso', artist: 'Pixinguinha' },
        { title: 'Chega de Saudade', artist: 'Tom Jobim' },
        { title: 'Corcovado', artist: 'Tom Jobim' },
        { title: 'Desafinado', artist: 'Tom Jobim' },
        { title: 'Disparada', artist: 'Geraldo Vandré' },
        { title: 'Eu Sei Que Vou Te Amar', artist: 'Tom Jobim' },
      ],
      letters,
    };
  }
}
</script>
</body>
</html>

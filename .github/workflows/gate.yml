# The quality gate on every push and pull request.
#
# CI's whole job is to run scripts/gate — the project's single source of
# "is the tree green?" — on a neutral machine, over the app, the service and
# the cifra.md/ subtree, and nothing else (orchestrator/README.md;
# foundation.ci). It reimplements no check the gate performs: it only
# provisions the runner (checks the repository out, installs the toolchain the
# gate needs) and then delegates all verification to scripts/gate.
#
# Toolchain versions are read from the repo's own files (.node-version,
# service/go.mod), never hardcoded here, so a version bump moves CI with it.
name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    # Pinned, not ubuntu-latest: Railway deploys only on a green gate, so a
    # runner-image move (ubuntu-latest → 26.04 from 2026-10-19) must not stall
    # a deploy on setup-ruby, setup-python or Playwright's --with-deps lagging
    # the new image. Move it on a branch, deliberately.
    runs-on: ubuntu-24.04
    steps:
      # One checkout: cifra.md lives in the repository as the cifra.md/
      # subtree.
      - name: Check out estante-de-cifras
        uses: actions/checkout@v7
        with:
          path: estante-de-cifras

      # Node, pinned by .node-version; npm cache keyed on the lockfiles.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: estante-de-cifras/.node-version
          cache: npm
          cache-dependency-path: |
            estante-de-cifras/app/package-lock.json
            estante-de-cifras/api/package-lock.json
            estante-de-cifras/cifra.md/js/package-lock.json

      # Go, pinned by service/go.mod; module/build cache keyed on go.mod/go.sum.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: estante-de-cifras/service/go.mod
          cache-dependency-path: |
            estante-de-cifras/service/go.mod
            estante-de-cifras/api/go.sum

      # Python 3 for scripts/unblocked.py and the cifra.md reference's venv.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3"

      # TaskJuggler (tj3) is a Ruby gem the gate requires for WBS validation.
      # The runner's system Ruby has no writable gem directory (a bare
      # `gem install` fails there), so set up a Ruby of our own first; its
      # bin/ is on PATH, which puts tj3 there too.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install TaskJuggler
        run: |
          gem install --no-document taskjuggler -v 3.8.1
          tj3 --version

      # Docker with the Compose plugin ship with the standard Ubuntu runner;
      # the gate's end-to-end level brings the compose stack up when an e2e
      # harness exists.

      # Playwright's browsers, guarded on the e2e-web harness: inert until
      # foundation.e2e_web lands, then active with no further edit here. The
      # gate checks for the browsers and fails if absent — it does not install
      # them, so CI must. Installing them is provisioning, not verification.
      - name: Install Playwright browsers (once an e2e-web harness exists)
        working-directory: estante-de-cifras
        run: |
          if [ -f e2e/web/package.json ]; then
            cd e2e/web
            npm ci
            npx playwright install --with-deps
          else
            echo "e2e/web/package.json does not exist yet — skipping Playwright browser install"
          fi

      # The single source of green: the gate, over everything, nothing else.
      - name: Run scripts/gate
        working-directory: estante-de-cifras
        run: scripts/gate
